name: Promote native candidate

on:
  workflow_dispatch:
    inputs:
      candidate_run_id:
        description: Workflow run ID that produced the immutable candidate bundle.
        required: true
        type: string
      release_manifest_sha256:
        description: Lowercase SHA-256 of the approved native release manifest.
        required: true
        type: string
      release_channel:
        description: npm dist-tag for this exact version.
        required: true
        type: choice
        options: [alpha, beta, rc, latest]
      dry_run:
        description: Verify the complete promotion chain without publishing or tagging.
        required: true
        default: true
        type: boolean

permissions:
  actions: read
  contents: write

jobs:
  promote:
    name: Verify and promote immutable candidate
    runs-on: ubuntu-latest
    environment: ${{ inputs.dry_run && 'native-release-promotion-dry-run' || 'native-release-promotion' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: native-candidate-bundle
          path: candidate-bundle
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.candidate_run_id }}
      - name: Verify the approved immutable candidate
        run: >-
          node scripts/verify-native-candidate.js
          --bundle candidate-bundle
          --require-platform-install-evidence
          --expected-manifest-sha256 "${{ inputs.release_manifest_sha256 }}"
          --release-channel "${{ inputs.release_channel }}"
      - id: candidate
        name: Read verified candidate identity
        shell: pwsh
        run: |
          $metadata = Get-Content -Raw candidate-bundle/candidate-metadata.json | ConvertFrom-Json
          "source_sha=$($metadata.sourceSha)" >> $env:GITHUB_OUTPUT
          "package_version=$($metadata.packageVersion)" >> $env:GITHUB_OUTPUT
          "tag=v$($metadata.packageVersion)" >> $env:GITHUB_OUTPUT
      - name: Verify candidate workflow run provenance
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $run = gh api "repos/${{ github.repository }}/actions/runs/${{ inputs.candidate_run_id }}" | ConvertFrom-Json
          if ($run.path -ne '.github/workflows/native-candidate.yml') { throw 'Candidate artifact was not produced by native-candidate.yml.' }
          if ($run.event -ne 'workflow_dispatch' -or $run.status -ne 'completed' -or $run.conclusion -ne 'success') { throw 'Candidate workflow run did not complete successfully.' }
          if ($run.head_sha -ne '${{ steps.candidate.outputs.source_sha }}') { throw 'Candidate workflow head SHA does not match candidate metadata.' }
      - name: Prove candidate source commit is available
        shell: pwsh
        run: |
          git cat-file -e "${{ steps.candidate.outputs.source_sha }}^{commit}"
          if ($LASTEXITCODE -ne 0) { throw 'Candidate source commit is unavailable.' }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ steps.candidate.outputs.source_sha }}
          fetch-depth: 0
          path: candidate-source
      - name: Verify source to tarball to manifest chain
        shell: pwsh
        run: |
          node candidate-source/scripts/verify-native-candidate.js --bundle candidate-bundle --require-platform-install-evidence --expected-manifest-sha256 "${{ inputs.release_manifest_sha256 }}" --release-channel "${{ inputs.release_channel }}"
          node candidate-source/scripts/verify-native-release-set.js --assets candidate-bundle --main candidate-bundle/flopeek-main.tgz
      - name: Clean-room install exact candidate tarballs
        run: >-
          node candidate-source/scripts/verify-native-candidate-install.js
          --main candidate-bundle/flopeek-main.tgz
          --native candidate-bundle/flopeek-native-linux-x64-gnu-${{ steps.candidate.outputs.package_version }}.tgz
          --manifest candidate-bundle/native-release-manifest.json
          --output candidate-install-verification.json
      - name: Create exact source tag
        if: ${{ !inputs.dry_run }}
        shell: pwsh
        run: |
          $tag = "${{ steps.candidate.outputs.tag }}"
          $source = "${{ steps.candidate.outputs.source_sha }}"
          $remote = git ls-remote --tags origin "refs/tags/$tag" | ForEach-Object { ($_ -split "\s+")[0] }
          if ($remote) {
            git fetch --force origin "refs/tags/$tag:refs/tags/$tag"
            $existing = git rev-list -n 1 $tag
            if ($existing -ne $source) { throw "Tag $tag already identifies a different source commit." }
          } else {
            git tag -a $tag $source -m "Flopeek $tag"
            git push origin "refs/tags/$tag"
          }
      - name: Publish or verify immutable versions under staging tag
        if: ${{ !inputs.dry_run }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        shell: pwsh
        run: |
          if (-not $env:NODE_AUTH_TOKEN) { throw 'NPM_TOKEN is required.' }
          node candidate-source/scripts/publish-npm-release-set.js --assets candidate-bundle --staging-tag "native-candidate-${{ inputs.candidate_run_id }}"
      - name: Anonymous registry verification under the staging tag
        if: ${{ !inputs.dry_run }}
        env:
          NODE_AUTH_TOKEN: ""
          NPM_TOKEN: ""
        run: >-
          node candidate-source/scripts/verify-native-registry-release.js
          --bundle candidate-bundle
          --manifest candidate-bundle/native-release-manifest.json
          --channel "native-candidate-${{ inputs.candidate_run_id }}"
          --output registry-release-verification.json
      - name: Move public dist-tags only after all registry proofs pass
        if: ${{ !inputs.dry_run }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        shell: pwsh
        run: |
          $manifest = Get-Content -Raw candidate-bundle/native-release-manifest.json | ConvertFrom-Json
          $version = $manifest.release.version
          foreach ($packageName in $manifest.artifacts.native.PSObject.Properties.Name) {
            npm dist-tag add "$packageName@$version" "${{ inputs.release_channel }}"
          }
          npm dist-tag add "flopeek@$version" "${{ inputs.release_channel }}"
      - name: Create GitHub Release from exact candidate artifacts
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $tag = "${{ steps.candidate.outputs.tag }}"
          $prerelease = if ("${{ inputs.release_channel }}" -eq "latest") { @() } else { @("--prerelease") }
          $assets = @(Get-ChildItem -LiteralPath candidate-bundle -Recurse -File)
          $duplicates = @($assets | Group-Object Name | Where-Object Count -gt 1)
          if ($duplicates.Count -gt 0) { throw "Candidate bundle contains duplicate release asset names: $($duplicates.Name -join ', ')" }
          $assetPaths = @($assets | ForEach-Object FullName)
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag @assetPaths --clobber
          } else {
            gh release create $tag @assetPaths --target "${{ steps.candidate.outputs.source_sha }}" --title "Flopeek $tag" --generate-notes @prerelease
          }
      - name: Generate protected-environment promotion attestation
        shell: pwsh
        run: |
          $result = if ([System.Convert]::ToBoolean("${{ inputs.dry_run }}")) { "dry-run-verified" } else { "published" }
          node candidate-source/scripts/generate-native-promotion-attestation.js --candidate-run-id "${{ inputs.candidate_run_id }}" --manifest-sha256 "${{ inputs.release_manifest_sha256 }}" --source-sha "${{ steps.candidate.outputs.source_sha }}" --package-version "${{ steps.candidate.outputs.package_version }}" --channel "${{ inputs.release_channel }}" --promoted-by "${{ github.actor }}" --result $result --output native-release-approval.json
      - name: Remove staging dist-tags after successful promotion
        if: ${{ !inputs.dry_run && success() }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: node candidate-source/scripts/cleanup-npm-staging-tags.js --staging-tag "native-candidate-${{ inputs.candidate_run_id }}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: native-promotion-attestation-${{ inputs.candidate_run_id }}
          path: |
            native-release-approval.json
            candidate-install-verification.json
            registry-release-verification.json
          if-no-files-found: error
          retention-days: 90
