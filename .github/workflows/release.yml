name: Create tagged release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

jobs:
  native-binaries:
    name: Native ${{ matrix.package }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            package: '@flopeek/native-win32-x64'
            os: win32
            cpu: x64
          - runner: windows-11-arm
            package: '@flopeek/native-win32-arm64'
            os: win32
            cpu: arm64
          - runner: ubuntu-latest
            package: '@flopeek/native-linux-x64-gnu'
            os: linux
            cpu: x64
          - runner: ubuntu-24.04-arm
            package: '@flopeek/native-linux-arm64-gnu'
            os: linux
            cpu: arm64
          - runner: macos-13
            package: '@flopeek/native-darwin-x64'
            os: darwin
            cpu: x64
          - runner: macos-14
            package: '@flopeek/native-darwin-arm64'
            os: darwin
            cpu: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.97.0'
      - name: Build checked release binary
        run: cargo build --release --locked --manifest-path native/flopeek-core/Cargo.toml
      - name: Test native core before packaging
        run: cargo test --locked --manifest-path native/flopeek-core/Cargo.toml
      - name: Create platform npm package
        shell: pwsh
        run: |
          $binary = if ('${{ matrix.os }}' -eq 'win32') { 'native/flopeek-core/target/release/flopeek-native-core.exe' } else { 'native/flopeek-core/target/release/flopeek-native-core' }
          node scripts/package-native-platform.js --package '${{ matrix.package }}' --os '${{ matrix.os }}' --cpu '${{ matrix.cpu }}' --binary $binary --output native-dist
          New-Item -ItemType Directory -Force -Path release-assets | Out-Null
          npm pack ./native-dist --pack-destination release-assets
          Get-FileHash release-assets/*.tgz -Algorithm SHA256 | ForEach-Object { "$($_.Hash.ToLowerInvariant())  $($_.Path | Split-Path -Leaf)" } | Set-Content release-assets/checksums-${{ matrix.os }}-${{ matrix.cpu }}.txt
          $tarball = (Get-ChildItem release-assets/*.tgz | Select-Object -First 1).FullName
          node scripts/verify-clean-room-native-platform.js --platform-tarball $tarball
      - uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.os }}-${{ matrix.cpu }}
          path: release-assets/
          if-no-files-found: error

  verify-release-set:
    name: Verify complete release set before publication
    needs: native-binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.4'
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: npm ci
      - run: npm run check:go-stdlib
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Build rollout evidence from this exact release set
        run: node scripts/prepare-native-rollout-evidence.js --inputs packaging/native-rollout-inputs --assets release-assets --output packaging/native-rollout-evidence.json
      - name: Verify native artifacts before package assembly
        run: node scripts/verify-native-release-set.js --assets release-assets
      - run: npm run check:support
      - run: npm run check:docs
      - run: npm run test:public-source
      - run: npm run test:package
      - run: npm run audit:package
      - run: npm run verify:clean-room
      - name: Pack and bind the exact release set
        run: |
          mkdir main-dist
          npm pack --pack-destination main-dist
          main_tarball="$(find main-dist -maxdepth 1 -name 'flopeek-[0-9]*.tgz' -print -quit)"
          node scripts/verify-native-release-set.js --assets release-assets --main "$main_tarball"
          cp packaging/native-rollout-evidence.json main-dist/native-rollout-evidence.json
          sha256sum main-dist/native-rollout-evidence.json > main-dist/native-rollout-evidence.sha256
          sha256sum "$main_tarball" > main-dist/checksums-main.txt
          node scripts/build-native-release-manifest.js \
            --tag "$GITHUB_REF_NAME" \
            --main "$main_tarball" \
            --rollout-evidence packaging/native-rollout-evidence.json \
            --assets release-assets \
            --output main-dist/native-release-manifest.json
      - name: Verify owner approval against the exact release manifest
        run: |
          npm run verify:npm-publication
          npm run verify:github-release-preflight -- \
            --tag "$GITHUB_REF_NAME" \
            --manifest main-dist/native-release-manifest.json
      - uses: actions/upload-artifact@v4
        with:
          name: main-package
          path: main-dist/
          if-no-files-found: error

  publish-npm-release:
    name: Publish exact npm release and move dist-tags last
    needs: [native-binaries, verify-release-set]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Publish or verify immutable versions under a staging tag
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "NPM_TOKEN is required."
            exit 1
          fi
          staging_tag="native-candidate-${GITHUB_RUN_ID}"
          node scripts/publish-npm-release-set.js --assets release-assets --staging-tag "$staging_tag"
      - name: Anonymous registry clean-room install of the exact main package
        env:
          NODE_AUTH_TOKEN: ""
        run: |
          version="$(node -p "require('./package.json').version")"
          clean_room="$(mktemp -d)"
          cd "$clean_room"
          npm init -y >/dev/null
          npm install --ignore-scripts=false --registry=https://registry.npmjs.org "flopeek@${version}"
          node -e "const p=require('flopeek/package.json'); if(p.version!==process.argv[1]) process.exit(1)" "$version"
      - name: Move public dist-tags only after clean-room verification
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          version="$(node -p "require('./package.json').version")"
          for package in $(node -e "console.log(Object.keys(require('./package.json').optionalDependencies).join(' '))"); do
            npm dist-tag add "${package}@${version}" beta
          done
          npm dist-tag add "flopeek@${version}" beta
      - name: Verify the approved public registry state
        run: npm run verify:published-release -- --tag "$GITHUB_REF_NAME" --manifest release-assets/native-release-manifest.json
      - name: Remove staging dist-tags after successful promotion
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          staging_tag="native-candidate-${GITHUB_RUN_ID}"
          node scripts/cleanup-npm-staging-tags.js --staging-tag "$staging_tag"

  release:
    name: Verify and publish GitHub Release
    needs: [native-binaries, publish-npm-release]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - run: npm run verify:github-release -- --tag "$GITHUB_REF_NAME" --manifest release-assets/native-release-manifest.json
      - name: Create prerelease
        if: contains(github.ref_name, '-')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release-assets/* --target "$GITHUB_SHA" --title "Flopeek $GITHUB_REF_NAME" --generate-notes --prerelease
      - name: Create stable release
        if: ${{ !contains(github.ref_name, '-') }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release-assets/* --target "$GITHUB_SHA" --title "Flopeek $GITHUB_REF_NAME" --generate-notes
