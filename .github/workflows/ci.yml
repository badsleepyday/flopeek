name: Verify

on:
  push:
    branches: [main, development]
  pull_request:
  workflow_call:
    inputs:
      source_sha:
        description: Exact source commit to verify.
        required: true
        type: string

concurrency:
  group: verify-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_call' }}

permissions:
  contents: read

jobs:
  rust-msrv:
    name: Rust MSRV 1.88.0
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.source_sha || github.sha }}
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable 2026-08-02
        with:
          toolchain: 1.88.0
      - run: cargo check --locked --manifest-path native/flopeek-core/Cargo.toml

  quality:
    name: Linux quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json
      - id: toolchain-contract
        shell: pwsh
        run: |
          $channel = (Select-String -Path rust-toolchain.toml -Pattern '^\s*channel\s*=\s*"([^"]+)"\s*$').Matches.Groups[1].Value
          if (-not $channel) { throw 'rust-toolchain.toml has no exact channel.' }
          "rust=$channel" >> $env:GITHUB_OUTPUT
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable 2026-08-02
        with:
          toolchain: ${{ steps.toolchain-contract.outputs.rust }}
          components: rustfmt, clippy
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.26.4'
          cache: false
      - run: npm ci
      - run: npm run verify:toolchains
      - run: npm run check:go-stdlib
      - run: cargo fmt --check --manifest-path native/flopeek-core/Cargo.toml
      - run: cargo clippy --locked --manifest-path native/flopeek-core/Cargo.toml -- -D warnings
      - run: cargo test --locked --manifest-path native/flopeek-core/Cargo.toml
      - run: npm run verify:native-js-parser-parity
      - run: npm run test:unit
      - run: npm run test:contracts
      - run: node scripts/verify-branch-name.js
      - run: npm run check:support
      - run: npm run check:docs
      - run: npm run verify:core-baseline

  node-compatibility:
    name: Linux / Node ${{ matrix.node }} compatibility
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.source_sha || github.sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run test:node-compat

  native-platform:
    name: ${{ matrix.os }} / native / Node 22
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.source_sha || github.sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json
      - id: toolchain-contract
        shell: pwsh
        run: |
          $channel = (Select-String -Path rust-toolchain.toml -Pattern '^\s*channel\s*=\s*"([^"]+)"\s*$').Matches.Groups[1].Value
          if (-not $channel) { throw 'rust-toolchain.toml has no exact channel.' }
          "rust=$channel" >> $env:GITHUB_OUTPUT
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable 2026-08-02
        with:
          toolchain: ${{ steps.toolchain-contract.outputs.rust }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.26.4'
          cache: false
      - run: npm ci
      - run: npm run verify:toolchains
      - run: npm run test:native-platform
      - run: npm run verify:native-adapter-parity -- --output native-adapter-parity.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: adapter-parity-${{ matrix.os }}-node-22
          path: native-adapter-parity.json
          if-no-files-found: error
          retention-days: 14

  packaging:
    name: Packaging and clean-room install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.source_sha || github.sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:package
      - run: npm run audit:package
      - run: npm run verify:clean-room
