<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title description">
  <title id="title">One repository context. Two readers.</title>
  <desc id="description">People and coding agents resolve the same versioned technical evidence.</desc>
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#101a33"/><stop offset="1" stop-color="#172a55"/></linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#081126" flood-opacity=".18"/></filter>
  </defs>
  <rect width="1200" height="420" rx="28" fill="#f6f8fc"/>
  <rect x="28" y="28" width="1144" height="364" rx="22" fill="url(#panel)" filter="url(#shadow)"/>
  <text x="72" y="82" fill="#9fb4ff" font-family="Inter,Segoe UI,sans-serif" font-size="14" font-weight="700" letter-spacing="2">FLOWPEEK · EVIDENCE SNAPSHOT</text>
  <text x="72" y="122" fill="#ffffff" font-family="Inter,Segoe UI,sans-serif" font-size="28" font-weight="750">One repository context. Two readers.</text>
  <text x="72" y="151" fill="#b9c4dc" font-family="Inter,Segoe UI,sans-serif" font-size="15">People and coding agents resolve the same versioned technical evidence.</text>
  <g transform="translate(72 210)">
      <rect width="172" height="110" rx="17" fill="#ffffff" fill-opacity=".08" stroke="#9fb4ff" stroke-opacity=".25"/>
