      <text x="18" y="70" fill="#b9c4dc" font-family="Inter,Segoe UI,sans-serif" font-size="12">Supported parser facts</text>
      <path d="M 176 55 H 213" stroke="#8ef0cf" stroke-width="3"/><path d="M 205 48 L 214 55 L 205 62" fill="none" stroke="#8ef0cf" stroke-width="3"/>
    </g><g transform="translate(300 210)">
      <rect width="172" height="110" rx="17" fill="#ffffff" fill-opacity=".08" stroke="#9fb4ff" stroke-opacity=".25"/>
      <text x="18" y="43" fill="#ffffff" font-family="Inter,Segoe UI,sans-serif" font-size="17" font-weight="750">Flow Lens</text>
      <text x="18" y="70" fill="#b9c4dc" font-family="Inter,Segoe UI,sans-serif" font-size="12">Bounded static path</text>
      <path d="M 176 55 H 213" stroke="#8ef0cf" stroke-width="3"/><path d="M 205 48 L 214 55 L 205 62" fill="none" stroke="#8ef0cf" stroke-width="3"/>
    </g><g transform="translate(528 210)">
      <rect width="172" height="110" rx="17" fill="#294ba8" fill-opacity=".9" stroke="#9fb4ff" stroke-opacity=".9"/>
      <text x="18" y="43" fill="#ffffff" font-family="Inter,Segoe UI,sans-serif" font-size="17" font-weight="750">Context Ref</text>
      <text x="18" y="70" fill="#dfe6ff" font-family="Inter,Segoe UI,sans-serif" font-size="12">Project + graph version</text>
      <path d="M 176 55 H 213" stroke="#8ef0cf" stroke-width="3"/><path d="M 205 48 L 214 55 L 205 62" fill="none" stroke="#8ef0cf" stroke-width="3"/>
    </g><g transform="translate(756 210)">
      <rect width="172" height="110" rx="17" fill="#ffffff" fill-opacity=".08" stroke="#9fb4ff" stroke-opacity=".25"/>
      <text x="18" y="43" fill="#ffffff" font-family="Inter,Segoe UI,sans-serif" font-size="17" font-weight="750">Viewer + MCP</text>
      <text x="18" y="70" fill="#b9c4dc" font-family="Inter,Segoe UI,sans-serif" font-size="12">One shared context</text>
      <path d="M 176 55 H 213" stroke="#8ef0cf" stroke-width="3"/><path d="M 205 48 L 214 55 L 205 62" fill="none" stroke="#8ef0cf" stroke-width="3"/>
    </g><g transform="translate(984 210)">
      <rect width="172" height="110" rx="17" fill="#ffffff" fill-opacity=".08" stroke="#9fb4ff" stroke-opacity=".25"/>
      <text x="18" y="43" fill="#ffffff" font-family="Inter,Segoe UI,sans-serif" font-size="17" font-weight="750">Refresh</text>
      <text x="18" y="70" fill="#b9c4dc" font-family="Inter,Segoe UI,sans-serif" font-size="12">Changed + stale context</text>
      
    </g>
    <text x="72" y="378" fill="#b9c4dc" font-family="Inter,Segoe UI,sans-serif" font-size="13">Static evidence stays static. Human verification, test results, runtime observations, and agent declarations stay separate.</text>
